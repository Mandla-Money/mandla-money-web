# Staging path (company website):
#   merge/push to `staging`
#     → build+push GHCR (`staging-latest`)
#     → mandla-actions staging-deploy (`company-website`)
#     → staging VPS (144.126.210.43)
#
# Same pattern as other Mandla service repos (control-centre, customer-web, etc.).
# Live marketing hosts (mandlamoney.com) currently point at this staging fleet.

name: Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "src/**"
      - "public/**"
      - "package*.json"
      - "next.config.*"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/staging.yml"

concurrency:
  group: staging-company-website
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/mandla-money
  IMAGE_NAME: mandla-money-web
  COMPOSE_SERVICE: company-website

jobs:
  build-push:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.meta.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Require GHCR_TOKEN
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::Missing repo secret GHCR_TOKEN (classic PAT with write:packages)."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHORT="${GITHUB_SHA::12}"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=company-web-staging
          cache-to: type=gha,mode=max,scope=company-web-staging

  deploy:
    name: Deploy staging VPS
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch PAT
        env:
          PAT: ${{ secrets.MANDLA_ACTIONS_DISPATCH_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Missing repo secret MANDLA_ACTIONS_DISPATCH_PAT."
            exit 1
          fi

      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MANDLA_ACTIONS_DISPATCH_PAT }}
          repository: Mandla-Money/mandla-actions
          event-type: staging-deploy
          client-payload: >-
            {"service":"${{ env.COMPOSE_SERVICE }}","refresh_secrets":false,"image_tag":"staging-latest","sha":"${{ needs.build-push.outputs.short_sha }}"}
